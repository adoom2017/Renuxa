name: Publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 0.1.1
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
    steps:
      - name: Resolve image version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            publish_latest="$INPUT_PUBLISH_LATEST"
          else
            version="${REF_NAME#v}"
            publish_latest="true"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: renuxa-web
            dockerfile: docker/Dockerfile.web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: renuxa-web
            dockerfile: docker/Dockerfile.web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: renuxa-server
            dockerfile: docker/Dockerfile.server
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: renuxa-server
            dockerfile: docker/Dockerfile.server
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: adoom2018/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ needs.prepare.outputs.publish_latest }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          provenance: ${{ github.event_name == 'push' && 'true' || 'mode=min' }}
          sbom: ${{ github.event_name == 'push' && 'true' || 'false' }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [renuxa-web, renuxa-server]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          docker buildx imagetools create \
            --tag "adoom2018/${IMAGE}:${VERSION}" \
            "adoom2018/${IMAGE}:${VERSION}-amd64" \
            "adoom2018/${IMAGE}:${VERSION}-arm64"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            docker buildx imagetools create \
              --tag "adoom2018/${IMAGE}:latest" \
              "adoom2018/${IMAGE}:latest-amd64" \
              "adoom2018/${IMAGE}:latest-arm64"
          fi
