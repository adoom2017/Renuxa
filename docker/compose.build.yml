# Local-build variant. Start with:
#   docker compose --env-file .env -f docker/compose.build.yml up --build -d

x-server-build: &server-build
  build:
    context: ..
    dockerfile: docker/Dockerfile.server

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    init: true
    ports: ["${RENUXA_WEB_PORT:-3000}:80"]
    depends_on: { api: { condition: service_healthy } }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renuxa
      POSTGRES_PASSWORD: renuxa
      POSTGRES_DB: renuxa
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U renuxa"], interval: 5s, timeout: 3s, retries: 12 }

  api:
    <<: *server-build
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
      WECHAT_GATEWAY_URL: http://gateway:18765
      WECHAT_GATEWAY_TOKEN: ${WECHAT_GATEWAY_TOKEN:-}
      WECHAT_MODEL_URL: ${WECHAT_MODEL_URL:-}
      WECHAT_MODEL_NAME: ${WECHAT_MODEL_NAME:-}
      WECHAT_MODEL_API_KEY: ${WECHAT_MODEL_API_KEY:-}
    ports: ["${RENUXA_API_PORT:-8081}:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *server-build
    restart: unless-stopped
    init: true
    command: ["renuxa-worker"]
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
    depends_on: { api: { condition: service_healthy } }

  gateway:
    <<: *server-build
    profiles: ["wechat"]
    restart: unless-stopped
    init: true
    command: ["im-channel-gateway", "--config", "/etc/renuxa/wechat.toml", "run"]
    environment:
      WECHAT_GATEWAY_TOKEN: ${WECHAT_GATEWAY_TOKEN:-}
    volumes: ["wechat-data:/var/lib/renuxa-wechat"]
    depends_on: { api: { condition: service_healthy } }
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  postgres-data:
  wechat-data:
