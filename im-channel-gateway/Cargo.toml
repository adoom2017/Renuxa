[package]
name = "im-channel-gateway"
version = "0.1.0"
description = "Standalone IM gateway (Telegram, WeChat iLink) with pluggable agent backends"
authors = ["Adoom Contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "im_channel_gateway"
path = "src/lib.rs"

[[bin]]
name = "im-channel-gateway"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
aes = "0.8"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ecb = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.13", features = ["macros", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal", "process", "io-util"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
md5 = "0.7"
urlencoding = "2"
regex = "1"
url = "2"
image = "0.25"
qrcode = "0.14"
rqrr = "0.10"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
