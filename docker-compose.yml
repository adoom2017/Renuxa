x-server-image: &server-image
  image: adoom2018/renuxa-server:${RENUXA_VERSION:-0.1.2}

services:
  web:
    image: adoom2018/renuxa-web:${RENUXA_VERSION:-0.1.2}
    restart: unless-stopped
    init: true
    ports: ["3000:80"]
    depends_on: { api: { condition: service_healthy } }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renuxa
      POSTGRES_PASSWORD: renuxa
      POSTGRES_DB: renuxa
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U renuxa"], interval: 5s, timeout: 3s, retries: 12 }
  api:
    <<: *server-image
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
  worker:
    <<: *server-image
    restart: unless-stopped
    init: true
    command: ["renuxa-worker"]
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
    depends_on: { api: { condition: service_healthy } }
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
volumes:
  postgres-data:
