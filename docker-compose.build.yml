# Local-build variant. Start with:
#   docker compose -f docker-compose.build.yml up --build -d

x-server-build: &server-build
  build:
    context: .
    dockerfile: Dockerfile.server

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    ports: ["3000:80"]
    depends_on: { api: { condition: service_healthy } }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renuxa
      POSTGRES_PASSWORD: renuxa
      POSTGRES_DB: renuxa
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U renuxa"], interval: 5s, timeout: 3s, retries: 12 }

  api:
    <<: *server-build
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *server-build
    restart: unless-stopped
    init: true
    command: ["renuxa-worker"]
    environment:
      DATABASE_URL: postgres://renuxa:renuxa@postgres:5432/renuxa
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      SMTP_FROM: Renuxa <notifications@renuxa.local>
    depends_on: { api: { condition: service_healthy } }

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  postgres-data:
